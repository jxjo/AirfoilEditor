# see PyPI_how_to.docx

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "airfoileditor"
dynamic = ["version"]               
authors = [{ name="Jochen Guenzel", email="jochen@jxjo.de" }]
description = "View, Modify, Optimize Airfoils"
readme = "doc/README_PyPi.md"
keywords = ["airfoil", "aerodynamics", "xfoil", "neuralfoil", "xoptfoil2", "bezier", "cst", "airfoil optimization"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "packaging>=24.0",
  "requests",
  "pyqt6==6.12.0",
  "PyQt6-Qt6==6.12.0",  
  "pyqtgraph>=0.14.0",
  "f90nml>=1.4.4",
  "termcolor>=2.3.0",
  "platformdirs>=4.3.0",
  "ezdxf>=1.4.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/jxjo/AirfoilEditor"
Documentation = "https://github.com/jxjo/AirfoilEditor#readme"
Changelog = "https://github.com/jxjo/AirfoilEditor/blob/main/CHANGELOG.md"
Releases = "https://github.com/jxjo/AirfoilEditor/releases"
Issues = "https://github.com/jxjo/AirfoilEditor/issues"

[project.gui-scripts]                       # run without console window on Windows
airfoileditor = "airfoileditor.app:start"

[project.scripts]                           # run with console window on Windows
ae_console = "airfoileditor.app:start"

[tool.hatch.version]
path = "airfoileditor/app.py"

[tool.hatch.build.targets.wheel]
packages = ["airfoileditor"]
only-include = [
  "airfoileditor",
  "examples_optimize",
  "assets",
  "icons"
]

[tool.hatch.build.targets.wheel.sources]
"examples_optimize" = "airfoileditor/examples_optimize"
"assets" = "airfoileditor/assets"
"icons" = "airfoileditor/icons"

[tool.hatch.build.targets.sdist]
exclude = [
  "doc",
]
include = [
  "airfoileditor",
  "examples_optimize",
  "assets",
  "icons",
  "README.md",
  "LICENSE"
]

[tool.pytest.ini_options]
pythonpath = ["airfoileditor"]          # add project root to sys.path to find airfoileditor modules
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:ezdxf\\..*",
  "ignore:.*parseAll.*deprecated.*:DeprecationWarning:pyparsing\\.util",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]